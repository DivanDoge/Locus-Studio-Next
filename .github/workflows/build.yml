name: Multi-platform Build

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'nextgen-nps-studio/package-lock.json'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install dependencies
        working-directory: nextgen-nps-studio
        run: npm install

      - name: Configure Tauri signing
        working-directory: nextgen-nps-studio
        shell: bash
        run: |
          echo "TAURI_SIGNING_PRIVATE_KEY=${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      
      - name: Build frontend
        working-directory: nextgen-nps-studio
        run: npm run build
      
      - name: Build Tauri app
        working-directory: nextgen-nps-studio
        run: npm run tauri build -- --target ${{ matrix.target }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nps-studio-windows-${{ matrix.arch }}
          path: |
            nextgen-nps-studio/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            nextgen-nps-studio/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
            nextgen-nps-studio/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            nextgen-nps-studio/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.sig
          if-no-files-found: ignore

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'nextgen-nps-studio/package-lock.json'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      
      - name: Install dependencies
        working-directory: nextgen-nps-studio
        run: npm install

      - name: Configure Tauri signing
        working-directory: nextgen-nps-studio
        shell: bash
        run: |
          echo "TAURI_SIGNING_PRIVATE_KEY=${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      
      - name: Build frontend
        working-directory: nextgen-nps-studio
        run: npm run build
      
      - name: Build Tauri app
        working-directory: nextgen-nps-studio
        run: npm run tauri build
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nps-studio-linux-x64
          path: |
            nextgen-nps-studio/src-tauri/target/release/bundle/appimage/*.AppImage
            nextgen-nps-studio/src-tauri/target/release/bundle/appimage/*.sig
            nextgen-nps-studio/src-tauri/target/release/bundle/deb/*.deb
            nextgen-nps-studio/src-tauri/target/release/bundle/deb/*.sig
          if-no-files-found: ignore

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'nextgen-nps-studio/package-lock.json'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install dependencies
        working-directory: nextgen-nps-studio
        run: npm install

      - name: Configure Tauri signing
        working-directory: nextgen-nps-studio
        shell: bash
        run: |
          echo "TAURI_SIGNING_PRIVATE_KEY=${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      
      - name: Build frontend
        working-directory: nextgen-nps-studio
        run: npm run build
      
      - name: Build Tauri app
        working-directory: nextgen-nps-studio
        run: npm run tauri build -- --target ${{ matrix.target }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nps-studio-macos-${{ matrix.arch }}
          path: |
            nextgen-nps-studio/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            nextgen-nps-studio/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.sig
          if-no-files-found: ignore

  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate latest.json
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          release_dir = Path("release-artifacts")
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.lstrip("v")
          pub_date = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          def find_one(predicate):
              for path in sorted(release_dir.rglob("*")):
                  if path.is_file() and predicate(path):
                      return path
              raise SystemExit("Required release artifact not found")

            def find_path(*needles):
              for path in sorted(release_dir.rglob("*")):
                text = path.as_posix()
                if path.is_file() and all(needle in text for needle in needles):
                  return path
              raise SystemExit(f"Required release artifact not found: {' '.join(needles)}")

          def read_sig(path: Path) -> str:
              return path.read_text(encoding="utf-8").strip()

          def asset_url(path: Path) -> str:
              return f"https://github.com/{repo}/releases/download/{tag}/{path.name}"

          windows_exe = find_path("x86_64-pc-windows-msvc", "/bundle/nsis/")
          linux_appimage = find_path("/bundle/appimage/", ".AppImage")
          mac_aarch64 = find_path("aarch64-apple-darwin", "/bundle/macos/", ".app.tar.gz")
          mac_x86_64 = find_path("x86_64-apple-darwin", "/bundle/macos/", ".app.tar.gz")

          payload = {
              "version": version,
              "notes": f"Release {version}",
              "pub_date": pub_date,
              "platforms": {
                  "windows-x86_64": {
                      "url": asset_url(windows_exe),
                      "signature": read_sig(Path(str(windows_exe) + ".sig")),
                  },
                  "linux-x86_64": {
                      "url": asset_url(linux_appimage),
                      "signature": read_sig(Path(str(linux_appimage) + ".sig")),
                  },
                  "darwin-aarch64": {
                      "url": asset_url(mac_aarch64),
                      "signature": read_sig(Path(str(mac_aarch64) + ".sig")),
                  },
                  "darwin-x86_64": {
                      "url": asset_url(mac_x86_64),
                      "signature": read_sig(Path(str(mac_x86_64) + ".sig")),
                  },
              },
          }

          release_dir.joinpath("latest.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
    PY
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
